<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parjanya Shankar</title>
  <meta name="description" content="Personal website of Parjanya Shankar. Under construction.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1c1b">
  <link rel="canonical" href="https://parjanya.me/">
  <meta property="og:title" content="Parjanya Shankar">
  <meta property="og:description" content="Website under construction.">
  <meta property="og:url" content="https://parjanya.me/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1b'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='600' fill='%23ebe9e4'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
  <style>
    :root {
      --bg: #1c1c1b;      /* charcoal */
      --fg: #ebe9e4;      /* warm off-white */
      --muted: #9c9a94;
      --faint: #8a8781;
      --rule: #343331;
      --signal: #c6a15e; /* muted amber status dot */
      --sans: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    html { background: var(--bg); }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    main {
      width: 100%;
      max-width: 480px;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    h1 {
      font-size: clamp(30px, 7vw, 40px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      font-size: 17px;
      color: var(--muted);
    }

    .dot {
      position: relative;
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--signal);
    }

    .dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--signal);
      animation: pulse 2.6s ease-out infinite;
    }

    hr {
      border: 0;
      height: 1px;
      margin: 40px 0 24px;
      background: var(--rule);
    }

    a {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      padding-bottom: 4px;
      color: var(--fg);
      font-size: 15px;
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      transition: border-color 0.2s ease;
    }

    a:hover,
    a:focus-visible { border-color: var(--fg); }

    a:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 6px;
      border-radius: 2px;
    }

    .handle {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--faint);
      transition: color 0.2s ease;
    }

    .arrow {
      color: var(--muted);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    a:hover .handle { color: var(--muted); }
    a:hover .arrow { color: var(--fg); transform: translate(2px, -2px); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes pulse {
      0% { opacity: 0.55; transform: scale(1); }
      70%, 100% { opacity: 0; transform: scale(2.8); }
    }

    @media (max-width: 420px) {
      body { padding: 40px 20px; }
      .status { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .dot::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Parjanya Shankar</h1>
    <p class="status"><span class="dot" aria-hidden="true"></span>Website under construction.</p>
    <hr>
    <a href="https://www.linkedin.com/in/parjanya-s/" target="_blank" rel="noopener noreferrer">
      LinkedIn <span class="handle">in/parjanya-s</span> <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>
  </main>
</body>
</html>
