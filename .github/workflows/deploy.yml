# Type-check, build and link-check on every push and pull request.
# Pushes to main also deploy to GitHub Pages (custom domain from public/CNAME).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Check links (fails on broken internal links or a missing resume.pdf)
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  lighthouse:
    # Informational: reports scores against the budgets in lighthouserc.json
    # but does not block deploys (CI machines make performance scores noisy).
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact
      - run: mkdir dist && tar -xf artifact/artifact.tar -C dist
      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
